name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # treasury-sdk is installed from the public SDK repo on GitHub. The lock file records it by its
      # ssh address, which needs a key even for public repos, so fetch it over https instead.
      - name: Fetch the SDK repo over https
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
