name: Deploy to GitHub Pages

# Builds the static site (out/) and publishes it at https://soroban-treasury.github.io/Frontend/.
#
# On GitHub's free plan, Pages only works for public repositories, so this does nothing while the
# repository is private. Once it is public, turn Pages on once: Settings -> Pages -> Source: GitHub Actions.
#
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   NEXT_PUBLIC_NETWORK   testnet (default) or mainnet
#   NEXT_PUBLIC_RPC_URL   your RPC provider, recommended for mainnet
#   NEXT_PUBLIC_API_URL   a running treasury-api, for the activity log

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Same as in ci.yml: the lock file's ssh address for the SDK repo, fetched over https.
      - name: Fetch the SDK repo over https
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The site lives under /Frontend, so links and files need that prefix.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_NETWORK: ${{ vars.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
